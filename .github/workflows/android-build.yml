name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk --version

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build ARM64 Debug APK
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android34-clang
        run: |
          set -o pipefail
          chmod +x gradlew
          rustc --version
          cargo --version
          ./gradlew :PetLib:cargoBuild :ZalithLauncher:assembleDebug --stacktrace --no-daemon --max-workers=2 2>&1 | tee android-build.log

      # Preserve a useful excerpt in the check-run annotations when the runner's
      # signed log download is unavailable to the build sandbox.
      - name: Report Gradle failure excerpt
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          log = Path("android-build.log")
          if not log.is_file():
              raise SystemExit(0)
          lines = log.read_text(errors="replace").splitlines()
          if not lines:
              lines = ["Gradle log is empty"]
          # Gradle writes its banner to stderr. tee and Gradle's rich console can
          # make the capture look non-empty while its failure message is missing;
          # extract the actual error headline and retain context around it.
          markers = (
              "what went wrong:", "* exception is:", "* where:", "* what went wrong:",
              "could not resolve", "plugin [id:", "a problem occurred", "script compilation error",
              "execution failed for task", "caused by:", "e: file://", "error:",
              "no matching variant", "unsupported class file", "failed with an exception",
          )
          selected = set()
          for index, line in enumerate(lines):
              if any(marker in line.lower() for marker in markers):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 12)))
          if not selected:
              selected.update(range(max(0, len(lines) - 80), len(lines)))
          for index in sorted(selected)[:45]:
              line = lines[index].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle diagnostic line {index + 1}::{line}")
          PY

      - name: Verify APK
        run: |
          set -e
          APK=$(find ZalithLauncher/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$APK"
          unzip -t "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLauncher-ARM64-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
