name: Publish Beta APK

on:
  workflow_call:
    inputs:
      build_run_id:
        description: Successful Build CI run containing the verified all-architecture Debug APK
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build CI run containing the verified all-architecture Debug APK
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verifier
        uses: actions/checkout@v6

      - name: Validate source build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" '
            .name == "Build CI"
            and .path == ".github/workflows/push_ci.yml"
            and .event == "push"
            and .conclusion == "success"
            and .head_repository.full_name == $repository
          ' <<<"$run_json" >/dev/null; then
            echo "Expected a successful push run from this repository's Build CI workflow" >&2
            exit 1
          fi
          build_sha=$(jq -r '.head_sha' <<<"$run_json")
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")
          if ! jq -e '[.artifacts[] | select(.name == "debug apk (all)" and .expired == false)] | length == 1' <<<"$artifacts" >/dev/null; then
            echo "The run does not have exactly one unexpired all-architecture Debug APK artifact" >&2
            exit 1
          fi
          echo "BUILD_SHA=$build_sha" >> "$GITHUB_ENV"
          echo "Verified successful Build CI run $BUILD_RUN_ID at $build_sha"

      - name: Download verified all-architecture APK
        uses: actions/download-artifact@v8
        with:
          name: debug apk (all)
          path: ./artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify APK and create checksum
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find artifact -type f -name "BLauncher_Beta1.apk" -print)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one BLauncher_Beta1.apk; found ${#APK_FILES[@]}" >&2
            exit 1
          fi
          APK=${APK_FILES[0]}
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          python3 .github/scripts/verify_apk_lifecycle_class.py "$APK"
          cp "$APK" "$RUNNER_TEMP/BLauncher_Beta1.apk"
          sha256sum "$RUNNER_TEMP/BLauncher_Beta1.apk" | awk '{ print $1 "  BLauncher_Beta1.apk" }' > "$RUNNER_TEMP/BLauncher_Beta1.apk.sha256"
          echo "APK_PATH=$RUNNER_TEMP/BLauncher_Beta1.apk" >> "$GITHUB_ENV"
          echo "SHA256_PATH=$RUNNER_TEMP/BLauncher_Beta1.apk.sha256" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/BLauncher_Beta1.apk.sha256"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          TAG="v2.8.1-beta1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a published beta." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$APK_PATH" \
            "$SHA256_PATH" \
            --title "BLauncher Beta 1 (2.8.1)" \
            --notes "Universal Android Debug APK. Verified by Build CI run ${BUILD_RUN_ID}; SHA-256 checksum included. This is a beta build." \
            --prerelease \
            --target "$BUILD_SHA"
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
