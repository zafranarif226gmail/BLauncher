[versions]
agp = "9.3.0"
targetSdk = "34"
minSdk = "21"
#noinspection GradleDependency,NewerVersionAvailable
bytehook = "1.0.10"
coilCompose = "3.4.0"
compress = "1.28.0"
documentfile = "1.1.0"
zip4j = "2.11.6"
commonsCodec = "1.23.0"
commonsIo = "2.22.0"
constraintlayoutCompose = "1.1.2"
buildKeys = "1.0.0"
coreSplashscreen = "1.2.0"
desugarJdkLibs = "2.1.5"
# Sora Editor 0.24.7 raised minSdk to 23; 0.24.6 is the last API 21 release.
editorBom = "0.24.6"
# Fishnet 1.1.0 raises minSdk to 23; 1.0.6 retains API 21 support.
fishnet = "1.0.6"
gson = "2.15.0"
jetbrainsAnnotations = "26.1.0"
kotlin = "2.4.21"
kspPlugin = "2.3.12"
# Activity 1.12 raised minSdk to 23; use the API 21-compatible line.
androidxActivity = "1.11.0"
# Core 1.18.0 raised minSdk to 23; keep Core/Core-ktx on the API 21 line.
androidxCore = "1.17.0"
kotlinxCoroutinesAndroid = "1.11.0"
ktor = "3.6.1"
# Keep the Lifecycle core modules on the API 21-compatible 2.9 line.
lifecycleRuntimeKtx = "2.9.4"
# Navigation3 1.2.0 calls rememberLifecycleOwner, added in Lifecycle Compose 2.10.0.
lifecycleRuntimeCompose = "2.10.0"
# SavedState 1.4 raised its minSdk; keep SavedState on the 1.3 API 21 line.
savedState = "1.3.3"
# Compose Multiplatform 1.9.3 uses Compose Runtime 1.9.4, before the API 23 floor.
jetbrainsComposeRuntime = "1.9.3"
# Graphics Shapes 1.1.0 raised minSdk; Material3 Expressive also works with 1.0.1.
graphicsShapes = "1.0.1"
composeBom = "2026.09.00"
lunarcalendar = "4.0.7"
material = "1.12.0"
material3 = "1.5.0-beta02"
materialKolor = "5.0.1"
mavenArtifact = "3.10.0"
# Media3 1.9.0 raised minSdk to 23; keep 1.8.1 for API 21 support.
media3Exoplayer = "1.8.1"
minidnsHla = "1.1.3"
#noinspection GradleDependency,NewerVersionAvailable
mmkv = "1.3.14"
compose-richtext = "1.0.0-alpha05"
navigation3 = "1.2.0"
# Keep the standalone Navigation3 adapter on its API 21-compatible alpha release.
navigation3Lifecycle = "1.0.0-alpha04"
okhttp = "5.5.1"
okio = "3.18.2"
processPhoenix = "3.0.0"
proxyClientAndroid = "0.0.5"
reorderable = "3.1.0"
# Room 2.8 raised its Android minimum from API 21 to 23.
room = "2.7.2"
toml4j = "0.7.2"
xz = "1.12"
jspecify = "1.0.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
dagger = "2.60.1"
hilt = "1.4.0"
# WindowManager 1.5.0's Android artifacts require API 23.
windowManager = "1.4.0"

[libraries]
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Exoplayer" }
buildkeys = { module = "com.github.MovTery.BuildKeys:core", version.ref = "buildKeys" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
editor = { module = "io.github.rosemoe:editor" }
editor-bom = { module = "io.github.rosemoe:editor-bom", version.ref = "editorBom" }
editor-language-textmate = { module = "io.github.rosemoe:language-textmate" }
fishnet = { module = "io.github.kyant0:fishnet", version.ref = "fishnet" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayoutCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-nav3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "navigation3Lifecycle" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
